name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build free package
        run: Scripts/package-free.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "DevBar $GITHUB_REF_NAME" \
            --notes "DevBar 首个公开版本，包含剪贴板历史、JSON、二维码、Markdown、区域截图和手动长图。要求 macOS 26 或更高版本、Apple Silicon；免费包为 ad-hoc 签名，首次打开请右键选择“打开”。" \
            build/DevBar-free-macOS-arm64.zip
